<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Circxit</title>
    <link rel="icon" type="image/webp" href="/src/ui/brand/logo-orb.webp" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body, #root { width: 100%; height: 100%; overflow: hidden; background: #050a07; font-family: "osifont", "Helvetica Neue", Arial, system-ui, sans-serif; }
      button, input, select, textarea { font: inherit; }
      button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid #75f0c1; outline-offset: 1px; }
      @keyframes cx-pulse { 0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(117,240,193,0.5); } 50% { opacity: 0.58; box-shadow: 0 0 0 6px rgba(117,240,193,0); } }
      @keyframes cx-fade-up { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes cx-slide-build { from { opacity: 0; transform: translateX(14px); } to { opacity: 1; transform: translateX(0); } }
      @keyframes cx-slide-simulate { from { opacity: 0; transform: translateX(-14px); } to { opacity: 1; transform: translateX(0); } }
      .cx-guide-ring { animation: cx-pulse 1.4s ease-in-out infinite; }
      .cx-enter { animation: cx-fade-up 190ms cubic-bezier(.2,.8,.3,1) both; }
      .cx-mode-build { animation: cx-slide-build 220ms cubic-bezier(.2,.8,.3,1) both; }
      .cx-mode-simulate { animation: cx-slide-simulate 220ms cubic-bezier(.2,.8,.3,1) both; }
      button { transition: transform 140ms ease, filter 140ms ease, border-color 140ms ease, background-color 140ms ease; }
      @media (hover: hover) and (pointer: fine) { button:not(:disabled):hover { transform: translateY(-1px); filter: brightness(1.12); } }
      @media (prefers-reduced-motion: reduce) {
        .cx-guide-ring, .cx-enter, .cx-mode-build, .cx-mode-simulate { animation: none; }
        button { transition: none; }
        button:not(:disabled):hover { transform: none; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
