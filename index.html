<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Circuit X-Ray</title>
    <link rel="icon" type="image/webp" href="/src/ui/brand/logo-orb.webp" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body, #root { width: 100%; height: 100%; overflow: hidden; background: #050b18; }
      button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid #4fd8ff; outline-offset: 1px; }
      @keyframes cx-pulse { 0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(79,216,255,0.55); } 50% { opacity: 0.55; box-shadow: 0 0 0 6px rgba(79,216,255,0); } }
      .cx-guide-ring { animation: cx-pulse 1.4s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) { .cx-guide-ring { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
